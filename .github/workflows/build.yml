name: Build APK (debug + optimized arm64 release)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataproxy-build-${ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle distribution and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/gradle-8.10.2
          key: gradle-${ runner.os }}-8.10.2-${ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${ runner.os }}-8.10.2-

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install Gradle 8.10.2 unless cached
        run: |
          if [ ! -x "$HOME/gradle-8.10.2/bin/gradle" ]; then
            wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle-8.10.2-bin.zip -d "$HOME"
          fi
          echo "$HOME/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Run JVM tests and build debug + minified release
        run: >
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          --build-cache --no-daemon --console=plain
          -Dorg.gradle.java.home="$JAVA_HOME"

      - name: APK sizes
        run: du -h app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dataproxy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload minified arm64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: dataproxy-arm64-minified-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
